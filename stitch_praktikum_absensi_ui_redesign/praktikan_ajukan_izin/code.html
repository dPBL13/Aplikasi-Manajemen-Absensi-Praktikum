<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajukan Izin Praktikum — Manajemen Absensi Praktikum</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */
globalThis.tailwind = globalThis.tailwind || {};
globalThis.tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        'eclipse-canvas': '#272757',
        'on-eclipse-canvas': '#FFFFE3',
        'eclipse-deep': '#0F0E47',
        'on-eclipse-deep': '#FFFFE3',
        'eclipse-mid': '#505081',
        'on-eclipse-mid': '#FFFFE3',
        'eclipse-muted': '#8686AC',
        'moss-canvas': '#CBCBCB',
        'on-moss-canvas': '#4A4A4A',
        'moss-surface': '#FFFFE3',
        'on-moss-surface': '#4A4A4A',
        'moss-surface-elevated': '#CBCBCB',
        'on-moss-surface-elevated': '#4A4A4A',
        'moss-primary': '#586B7E',
        'on-moss-primary': '#FFFFE3',
        'moss-deep': '#4A4A4A',
        'on-moss-deep': '#FFFFE3',
        'text-primary': '#4A4A4A',
        'text-secondary': '#4A4A4A',
        'text-on-dark': '#FFFFE3',
        'border-subtle': '#8686AC',
        'status-active': '#586B7E',
        'on-status-active': '#FFFFE3',
        'status-pending': '#CBCBCB',
        'on-status-pending': '#4A4A4A',
        'status-completed': '#FFFFE3',
        'on-status-completed': '#4A4A4A',
        'status-alert': '#E8C5BE',
        'on-status-alert': '#7A2E22',
        'alert-border': '#A84A3B',
        'disabled': '#CBCBCB',
        'on-disabled': '#4A4A4A',
      },
      borderRadius: {
        'sm': '8px',
        'DEFAULT': '12px',
        'md': '12px',
        'lg': '16px',
        'xl': '20px',
        'full': '9999px',
      },
      spacing: {
        'gutter-xs': '4px',
        'gutter-sm': '8px',
        'gutter-md': '12px',
        'gutter-lg': '16px',
        'gutter-xl': '24px',
        'section': '20px',
        'page-margin': '16px',
      },
      fontFamily: {
        'display': ['"Red Hat Display"', 'sans-serif'],
        'headline': ['"Red Hat Display"', 'sans-serif'],
        'title': ['"Commissioner"', 'sans-serif'],
        'body': ['"Commissioner"', 'sans-serif'],
        'label': ['"Commissioner"', 'sans-serif'],
        'mono': ['"Spline Sans Mono"', 'monospace'],
      },
      fontSize: {
        'display-md': ['36px', { lineHeight: '42px', letterSpacing: '-0.5px', fontWeight: '700' }],
        'display-md-mobile': ['28px', { lineHeight: '34px', letterSpacing: '-0.25px', fontWeight: '700' }],
        'headline-lg': ['24px', { lineHeight: '30px', letterSpacing: '-0.2px', fontWeight: '700' }],
        'headline-md': ['20px', { lineHeight: '26px', letterSpacing: '-0.1px', fontWeight: '700' }],
        'title-md': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '17px', letterSpacing: '0.1px', fontWeight: '400' }],
        'label-lg': ['14px', { lineHeight: '18px', letterSpacing: '0.1px', fontWeight: '600' }],
        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.25px', fontWeight: '600' }],
        'mono-sm': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '500' }],
      },
      transitionDuration: {
        'state-change': '120ms',
        'surface-enter': '220ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
      },
    },
  },
};
if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&amp;family=Red+Hat+Display:wght@600;700&amp;family=Spline+Sans+Mono:wght@500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-eclipse-canvas text-on-eclipse-canvas font-body antialiased">
  <div class="min-h-[884px] w-full max-w-md mx-auto bg-eclipse-canvas flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Contextual Header -->
    <header class="sticky top-0 z-20 bg-eclipse-canvas border-b border-eclipse-mid px-page-margin py-gutter-md flex items-center gap-gutter-sm">
      <a href="#detail-sesi" aria-label="Kembali ke Detail Sesi" class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-eclipse-mid text-on-eclipse-mid hover:bg-eclipse-deep transition-colors duration-state-change ease-state-change">
        <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_back</span>
      </a>
      <div class="flex flex-col">
        <h1 data-design-text-token="headline-md" class="font-headline text-headline-md text-on-eclipse-canvas">Ajukan Izin</h1>
        <p data-design-text-token="body-sm" class="font-body text-body-sm text-moss-surface">PPK · Kelas A · Lab LK1</p>
      </div>
    </header>

    <!-- Main Form -->
    <main class="flex-1 px-page-margin py-gutter-lg flex flex-col gap-gutter-lg">
      <form class="bg-moss-surface border border-border-subtle rounded-lg p-gutter-lg flex flex-col gap-gutter-md" onsubmit="return false;">

        <div class="bg-moss-surface-elevated rounded-md px-gutter-md py-gutter-sm flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-text-secondary">Sesi Praktikum</span>
          <span data-design-text-token="title-md" class="font-title text-title-md text-text-primary">PPK · Minggu, 29 Nov 2026</span>
          <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-text-secondary tabular-nums">15:15–18:00 WIB · Lab LK1</span>
        </div>

        <div class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-text-primary">Kategori Izin</span>
          <div class="grid grid-cols-3 gap-gutter-xs" role="group" aria-label="Pilih kategori izin">
            <button type="button" aria-pressed="true" class="izin-type-btn bg-moss-primary text-on-moss-primary font-label text-label-sm py-gutter-sm px-gutter-xs rounded-md transition-colors duration-state-change ease-state-change">
              <span data-design-text-token="label-sm">Sakit</span>
            </button>
            <button type="button" aria-pressed="false" class="izin-type-btn bg-moss-surface-elevated text-moss-deep border border-moss-deep font-label text-label-sm py-gutter-sm px-gutter-xs rounded-md transition-colors duration-state-change ease-state-change hover:bg-moss-surface">
              <span data-design-text-token="label-sm">Dispensasi</span>
            </button>
            <button type="button" aria-pressed="false" class="izin-type-btn bg-moss-surface-elevated text-moss-deep border border-moss-deep font-label text-label-sm py-gutter-sm px-gutter-xs rounded-md transition-colors duration-state-change ease-state-change hover:bg-moss-surface">
              <span data-design-text-token="label-sm">Mendesak</span>
            </button>
          </div>
        </div>

        <label class="flex flex-col gap-gutter-xs w-full">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-text-primary">Alasan Lengkap</span>
          <textarea rows="3" placeholder="Jelaskan alasan ketidakhadiran Anda secara singkat dan jelas..." class="w-full bg-moss-surface-elevated text-text-primary placeholder:text-text-secondary border border-moss-primary rounded-md px-gutter-md py-gutter-sm font-body text-body-md focus:outline-none focus:ring-2 focus:ring-moss-deep"></textarea>
        </label>

        <div class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-text-primary">Lampiran Bukti (Surat Dokter / Tugas)</span>
          <label class="bg-moss-surface-elevated border border-dashed border-moss-primary rounded-md p-gutter-md flex flex-col items-center justify-center gap-gutter-xs cursor-pointer hover:bg-moss-surface transition-colors duration-state-change ease-state-change">
            <span class="material-symbols-outlined text-headline-md text-text-primary" aria-hidden="true">upload_file</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-text-primary">Unggah JPG, PNG, atau PDF (Maks. 5 MB)</span>
            <input type="file" accept=".jpg,.jpeg,.png,.pdf" class="sr-only">
          </label>
        </div>

        <div class="pt-gutter-sm flex flex-col gap-gutter-sm">
          <!-- COMPONENT: button-primary -->
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm bg-moss-primary text-on-moss-primary font-label text-label-lg px-gutter-lg py-gutter-md rounded-md transition-colors duration-state-change ease-state-change hover:bg-moss-deep active:scale-95">
            <span class="material-symbols-outlined text-title-md" aria-hidden="true">send</span>
            <span data-design-text-token="label-lg">Kirim Pengajuan Izin</span>
          </button>
          <a href="#detail-sesi" class="w-full inline-flex items-center justify-center bg-moss-surface-elevated text-moss-deep border border-moss-deep font-label text-label-lg px-gutter-lg py-gutter-sm rounded-md transition-colors duration-state-change ease-state-change hover:bg-moss-surface">
            <span data-design-text-token="label-lg">Batal</span>
          </a>
        </div>

      </form>
    </main>

  </div>

  <script>
    (function () {
      const btns = document.querySelectorAll('.izin-type-btn');
      btns.forEach((btn) => {
        btn.addEventListener('click', () => {
          btns.forEach((b) => {
            const selected = b === btn;
            b.setAttribute('aria-pressed', String(selected));
            if (selected) {
              b.classList.remove('bg-moss-surface-elevated', 'text-moss-deep', 'border', 'border-moss-deep', 'hover:bg-moss-surface');
              b.classList.add('bg-moss-primary', 'text-on-moss-primary');
            } else {
              b.classList.remove('bg-moss-primary', 'text-on-moss-primary');
              b.classList.add('bg-moss-surface-elevated', 'text-moss-deep', 'border', 'border-moss-deep', 'hover:bg-moss-surface');
            }
          });
        });
      });
    })();
  </script>


</body></html>
